# hyprmac: layar kunci ala macOS Sonoma / Tahoe
#   atas       : tanggal kecil + jam besar
#   kanan atas : Wi-Fi dan baterai
#   bawah      : foto profil (atau inisial), nama, kolom kata sandi kapsul
# Latar: wallpaper aktif (disalin wallpaper.sh ke ~/.cache/hyprmac/wallpaper.png).
# Foto profil: simpan gambar persegi di ~/.face

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = mac, 0.32, 0.72, 0, 1
    animation = fadeIn, 1, 4, mac
    animation = fadeOut, 1, 4, mac
    animation = inputFieldDots, 1, 2, mac
}

background {
    monitor =
    path = ~/.cache/hyprmac/wallpaper.png
    color = rgba(1c1c22ff)
    blur_passes = 1
    blur_size = 3
    brightness = 0.85
}

# ---------------------------------------------------------------- jam

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(255, 255, 255, 0.85)
    font_size = 20
    font_family = Adwaita Sans SemiBold
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.25)
    position = 0, -70
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.9)
    font_size = 120
    font_family = Adwaita Sans Bold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.25)
    position = 0, -100
    halign = center
    valign = top
}

# --------------------------------------------------------- kanan atas

label {
    monitor =
    text = cmd[update:10000] w=""; nmcli -t -f TYPE,STATE dev 2>/dev/null | grep -q '^wifi:connected' && w="<span font_family='Material Symbols Rounded' size='15pt' rise='-3pt'>wifi</span>    "; b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); [ -n "$b" ] && b="$b%  <span font_family='Font Awesome 7 Free Solid' size='13pt'>&##xf240;</span>"; echo "$w$b"
    color = rgba(255, 255, 255, 0.9)
    font_size = 12
    font_family = Adwaita Sans SemiBold
    position = -24, -8
    halign = right
    valign = top
}

# ------------------------------------------------------------ pengguna

# Lingkaran berisi inisial (tertutup foto kalau ~/.face ada)
shape {
    monitor =
    size = 70, 70
    color = rgba(142, 142, 147, 0.95)
    rounding = -1
    border_size = 0
    position = 0, 190
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:0] echo "$USER" | cut -c1 | tr '[:lower:]' '[:upper:]'
    color = rgba(255, 255, 255, 1.0)
    font_size = 28
    font_family = Adwaita Sans SemiBold
    position = 0, 207
    halign = center
    valign = bottom
}

image {
    monitor =
    path = ~/.face
    size = 70
    rounding = -1
    border_size = 0
    position = 0, 190
    halign = center
    valign = bottom
}

# Nama lengkap dari akun, atau nama pengguna
label {
    monitor =
    text = cmd[update:0] n=$(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1); echo "${n:-$USER}"
    color = rgba(255, 255, 255, 0.95)
    font_size = 14
    font_family = Adwaita Sans SemiBold
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.3)
    position = 0, 155
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 210, 34
    outline_thickness = 0
    rounding = -1
    inner_color = rgba(255, 255, 255, 0.2)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = Adwaita Sans
    check_color = rgba(255, 255, 255, 0.3)
    fail_color = rgba(255, 69, 58, 0.45)
    fail_text = Kata sandi salah
    capslock_color = rgba(255, 214, 10, 0.4)
    placeholder_text = <span foreground="##ffffffb3" size="11pt">Masukkan Kata Sandi</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    hide_input = false
    shadow_passes = 0
    position = 0, 103
    halign = center
    valign = bottom
}

label {
    monitor =
    text = Tekan Enter untuk membuka
    color = rgba(255, 255, 255, 0.55)
    font_size = 10
    font_family = Adwaita Sans
    position = 0, 75
    halign = center
    valign = bottom
}
