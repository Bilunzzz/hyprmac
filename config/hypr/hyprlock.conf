# Layar kunci ala macOS: tanggal & jam besar di atas, foto + nama pengguna
# dan kolom kata sandi kaca di bawah. Latar: wallpaper (blur) dari wallpaper.sh.
# Foto profil: simpan gambar persegi di ~/.face

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.cache/hyprmac/wallpaper.png
    color = rgba(1c1c22ff)
    blur_passes = 3
    blur_size = 8
    brightness = 0.8
    vibrancy = 0.2
}

# Tanggal
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(255, 255, 255, 0.85)
    font_size = 22
    font_family = Adwaita Sans
    position = 0, 330
    halign = center
    valign = center
}

# Jam
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.92)
    font_size = 110
    font_family = Adwaita Sans Bold
    position = 0, 220
    halign = center
    valign = center
}

# Foto profil
image {
    monitor =
    path = ~/.face
    size = 84
    rounding = -1
    border_size = 0
    position = 0, -170
    halign = center
    valign = center
}

# Nama pengguna
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 15
    font_family = Adwaita Sans
    position = 0, -240
    halign = center
    valign = center
}

# Kata sandi
input-field {
    monitor =
    size = 220, 36
    outline_thickness = 1
    rounding = -1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(255, 255, 255, 0.15)
    font_color = rgba(255, 255, 255, 1.0)
    check_color = rgba(10, 132, 255, 0.6)
    fail_color = rgba(255, 95, 87, 0.7)
    fail_text = Kata sandi salah
    placeholder_text = <span foreground="##ffffffaa">Masukkan Kata Sandi</span>
    fade_on_empty = false
    hide_input = false
    position = 0, -290
    halign = center
    valign = center
}
