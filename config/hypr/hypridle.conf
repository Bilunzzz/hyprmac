# hypridle: redupkan layar, kunci, matikan layar, lalu tidurkan saat diam.

general {
    lock_cmd = pidof hyprlock || hyprlock                       # cegah hyprlock ganda
    before_sleep_cmd = loginctl lock-session                    # kunci sebelum tidur
    after_sleep_cmd = ~/.config/hypr/scripts/hypr-lib.sh dpms on # layar langsung nyala saat bangun
}

# 5 menit: redupkan layar
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 10 menit: kunci
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 menit: matikan layar
listener {
    timeout = 660
    on-timeout = ~/.config/hypr/scripts/hypr-lib.sh dpms off
    on-resume = ~/.config/hypr/scripts/hypr-lib.sh dpms on && brightnessctl -r
}

# 30 menit: tidurkan
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
